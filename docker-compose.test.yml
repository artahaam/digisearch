services:
  mongo_test:
    image: mongo:7
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant_test:
    image: qdrant/qdrant
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  unit_tests:
    build:
      context: .
      target: test
    environment:
      MONGO_URI: mongodb://invalid.test:27017
      MONGO_DB: digisearch_unit_test
      QDRANT_URL: http://invalid.test:6333
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: ["tests/unit", "-v"]


  integration_tests:
    build:
      context: .
      target: test
    depends_on:
      mongo_test:
        condition: service_healthy
      qdrant_test:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo_test:27017
      MONGO_DB: digisearch_test
      QDRANT_URL: http://qdrant_test:6333
      QDRANT_COLLECTION: digisearch_test
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - hf_cache:/models
    command: ["tests/integration", "-v"]


  airflow_dag_tests:
      build:
        context: .
        dockerfile: airflow/Dockerfile
        target: test
      entrypoint: ["pytest"]
      command: ["/opt/digisearch/tests/dags", "-v"]
      volumes:
        - ./airflow/dags:/opt/digisearch/airflow/dags:ro
        - ./tests/dags:/opt/digisearch/tests/dags:ro

volumes:
  hf_cache:
    external: true
    name: digisearch_hf_cache