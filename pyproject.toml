[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digisearch"
version = "0.1.0"
description = "Digikala search and scraping pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "artahaam", email = "alireza.thm03@gmail.com" }]
keywords = ["digikala", "scraping", "crawler", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a real MongoDB and Qdrant (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "wheels"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]