[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digisearch"
version = "0.1.0"
description = "Digikala search and scraping pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "artahaam", email = "alireza.thm03@gmail.com" }]
keywords = ["digikala", "scraping", "crawler", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.34,<3",
    "rich>=15,<16",
]

[project.scripts]
digisearch = "digisearch.run_pipeline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
